services:
  pursuarr:
    build: .
    image: pursuarr:latest
    ports:
      - "${PURSUARR_PORT:-8080}:8080"
    environment:
      PURSUARR_SETTINGS: /data/settings.php
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - pursuarr-data:/data
    restart: unless-stopped

volumes:
  pursuarr-data:
